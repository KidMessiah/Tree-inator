[workspace]
resolver = "2"
members = ["crates/forest-core", "crates/forest-cli", "crates/tree-inator"]

[workspace.dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
